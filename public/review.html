<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review · Paperscape</title>
    <meta
      name="description"
      content="Paperscape: plan ML conference submissions and organise literature reviews."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    />
    <script>
      try {
        const theme = localStorage.getItem('paperscape.theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {
        // Storage unavailable; fall back to the system theme.
      }
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/components/forms.css" />
    <link rel="stylesheet" href="css/components/cards.css" />
    <link rel="stylesheet" href="css/components/dialog.css" />
    <link rel="stylesheet" href="css/components/toast.css" />
    <link rel="stylesheet" href="css/components/chips.css" />
    <link rel="stylesheet" href="css/components/tabs.css" />
    <link rel="stylesheet" href="css/components/states.css" />
    <link rel="stylesheet" href="css/pages/reviews.css" />
    <link rel="stylesheet" href="css/pages/review.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="index.html">
          <img class="brand__mark" src="favicon.svg" alt="" width="28" height="28" />
          Paperscape
        </a>
        <nav class="site-nav" id="site-nav" aria-label="Main">
          <a href="conferences.html">Conferences</a>
          <a href="plans.html">Plans</a>
          <a href="reviews.html">Reviews</a>
        </nav>
        <div class="header-actions">
          <button
            class="icon-btn"
            id="theme-toggle"
            type="button"
            aria-label="Toggle theme"
          ></button>
          <button
            class="icon-btn nav-toggle"
            id="nav-toggle"
            type="button"
            aria-label="Menu"
            aria-expanded="false"
            aria-controls="site-nav"
          ></button>
        </div>
      </div>
    </header>
    <main id="main" class="container">
      <a class="back-link" href="reviews.html">← Your reviews</a>
      <div id="review-root" aria-live="polite"></div>

      <div class="review-body" id="review-body" hidden>
        <div class="tabs review-tabs" role="tablist" aria-label="Review sections">
          <button
            class="tab"
            type="button"
            role="tab"
            id="tab-list"
            aria-controls="panel-list"
            data-tab="list"
          >
            Reading list <span class="tab__count" id="list-count"></span>
          </button>
          <button
            class="tab"
            type="button"
            role="tab"
            id="tab-find"
            aria-controls="panel-find"
            data-tab="find"
          >
            Find papers
          </button>
          <button
            class="tab"
            type="button"
            role="tab"
            id="tab-threads"
            aria-controls="panel-threads"
            data-tab="threads"
          >
            Threads <span class="tab__count" id="threads-count"></span>
          </button>
          <button
            class="tab"
            type="button"
            role="tab"
            id="tab-citations"
            aria-controls="panel-citations"
            data-tab="citations"
          >
            Citations <span class="tab__count" id="citations-count"></span>
          </button>
          <button
            class="tab"
            type="button"
            role="tab"
            id="tab-map"
            aria-controls="panel-map"
            data-tab="map"
          >
            Map
          </button>
        </div>
        <section
          class="tab-panel"
          role="tabpanel"
          id="panel-list"
          aria-labelledby="tab-list"
          tabindex="0"
          hidden
        ></section>
        <section
          class="tab-panel"
          role="tabpanel"
          id="panel-find"
          aria-labelledby="tab-find"
          tabindex="0"
          hidden
        ></section>
        <section
          class="tab-panel"
          role="tabpanel"
          id="panel-threads"
          aria-labelledby="tab-threads"
          tabindex="0"
          hidden
        ></section>
        <section
          class="tab-panel"
          role="tabpanel"
          id="panel-citations"
          aria-labelledby="tab-citations"
          tabindex="0"
          hidden
        ></section>
        <section
          class="tab-panel"
          role="tabpanel"
          id="panel-map"
          aria-labelledby="tab-map"
          tabindex="0"
          hidden
        ></section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p>
          © 2026 Ayush Nimeshkumar Patel &amp; Harshitha Seetharaman ·
          <a href="https://johnguerra.co/classes/webDevelopment_online_summer_2026/index.html"
            >CS5610 Web Development</a
          >
        </p>
        <p>
          <a href="https://github.com/ayushp2207/paperscape">GitHub</a> ·
          <a href="https://github.com/ayushp2207/paperscape/blob/main/LICENSE">MIT License</a>
        </p>
      </div>
    </footer>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <script type="module" src="js/shared/nav.js"></script>
    <script type="module" src="js/review/reviewPage.js"></script>
  </body>
</html>
