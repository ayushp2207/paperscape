# Daily conference tracker: refreshes dates, checks official pages (every day during a
# deadline week, weekly otherwise) and keeps ONE pull request up to date for review.
name: Conference tracker

on:
  schedule:
    - cron: '0 7 * * *' # every day, 07:00 UTC
  workflow_dispatch:
    inputs:
      all:
        description: Check every upcoming conference page (not just deadline weeks)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conference-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tracker
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: >
          node scripts/track-conferences.js
          --summary "$RUNNER_TEMP/tracker-summary.md"
          ${{ inputs.all && '--all' || '' }}

      - name: Open or update the review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: tracker/updates
          delete-branch: true
          add-paths: scripts/data/*.json
          commit-message: 'chore(data): conference tracker updates'
          title: 'Conference tracker updates'
          body-path: ${{ runner.temp }}/tracker-summary.md
          labels: conference-tracker
